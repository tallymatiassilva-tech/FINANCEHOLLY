name: controle_financeiro_igreja
description: Aplicativo local para gestão financeira, cantina e estoque de igrejas.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite_sqlcipher: ^3.4.1
  flutter_secure_storage: ^9.2.4
  path: ^1.9.1
  path_provider: ^2.1.5
  excel: ^4.0.6
  share_plus: ^12.0.1
  fl_chart: ^1.1.1
  intl: ^0.20.2
  pdf: ^3.11.3
  printing: ^5.14.2
  provider: ^6.1.5+1
  file_picker: ^10.3.2
  crypto: ^3.0.6
  image_picker: ^1.2.4
  google_mlkit_text_recognition: ^0.17.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
